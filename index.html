<!doctype html>
<html lang="fr" class="dark" data-perf="high">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600;700&family=Geist:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Mohamed Raid Abadou · Embedded Systems Engineer</title>
    <meta
      name="description"
      content="Portfolio · M2 ESET · Firmware temps-réel, IoT, RF, traitement du signal. Disponible pour alternance ingénieur · septembre 2026."
    />
    <script>
      // Synchronous device-tier detection — runs before any React mount
      // so the first paint already has the correct perf class.
      (function () {
        try {
          var n = navigator;
          var cores = n.hardwareConcurrency || 4;
          var mem = n.deviceMemory || 4;
          var conn = n.connection || {};
          var save = conn.saveData === true;
          var eff = conn.effectiveType || "4g";
          var rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
          var mob = matchMedia("(max-width: 768px)").matches;

          var tier = "high";
          if (rm || save) tier = "low";
          else if (cores <= 2 || mem <= 2) tier = "low";
          else if (eff === "slow-2g" || eff === "2g" || eff === "3g") tier = "low";
          else if (cores <= 4 || mem <= 4 || (mob && cores <= 6)) tier = "mid";

          document.documentElement.setAttribute("data-perf", tier);
        } catch (e) {
          document.documentElement.setAttribute("data-perf", "high");
        }

        // Apply saved theme to avoid flash
        try {
          var t = localStorage.getItem("mra-theme");
          if (t === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-ink-50 text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
